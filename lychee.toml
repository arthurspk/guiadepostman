# Configuração do verificador de links (https://github.com/lycheeverse/lychee)
# Uso: lychee --no-progress './**/*.md'
#
# O LinkedIn responde HTTP 999 a qualquer verificador automatizado (bloqueio anti-bot),
# mesmo com o perfil no ar.
# O academy.postman.com (plataforma oficial de cursos/certificações da Postman) responde
# 403 a lychee mesmo com --no-progress, mas retorna 200 com curl usando User-Agent de
# navegador (verificado manualmente nesta revisão) — mesmo padrão de bloqueio anti-bot.
exclude = ["^https://www\\.linkedin\\.com/", "^https://academy\\.postman\\.com/"]
